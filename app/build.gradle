plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whisperkeyboard'
    compileSdk 34
    // NDK only needed if you add native code later; kept for arm64-v8a
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.moonshinekeyboard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-moonshine-v2"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // No signingConfigs for debug; release uses debug keystore by default

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // keep debuggable for testing
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // Moonshine Voice - on-device streaming STT (includes ONNX Runtime, no NDK build needed)
    implementation 'ai.moonshine:moonshine-voice:0.1.5'
    // OkHttp for model download (already transitive but explicit)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
